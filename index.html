<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video SDK JS 2.5.0</title>
    <link rel="stylesheet" href="styles.css">
  </head>
    <style>
    body {
       background-color: rgb(167, 173, 177);
       background-image: url("https://zoom.us/account/branding/p/b7f37763-6dee-4be3-8c55-cda5ba5c7310.gif");
    }
  </style>
  <body>
    <main>
      <div id="landing">
        <h2> Video WebSDK 2.5.0 💬</h2>
        <small id="error">Session full, join another.</small>
        <input type="text" placeholder="😃 Enter Name" id="userName">
        <input type="text" placeholder="🚪 Session Name" id="sessionName">
        <input type="text" placeholder="🔑 Session Passcode" id="sessionPasscode">
        <button onClick="getSignature()" class="primary" id="getSignature">Join Session</button>
        <small class="zoom">Powered by the <a href="https://marketplace.zoom.us/docs/sdk/video/introduction/" target="_blank">Zoom Video SDK</a></small>
      </div>

      <div id="session">
        <div class="self">
          <h3 id="self-view-name">😃 Me</h3>
          <video-player-container id="self-view-container"></video-player-container>
        </div>
        <div class="participant">
          <h3 id="participant-name">⏳ Waiting for participant to join...</h3>
          <video-player-container id="participant-container"></video-player-container>
        </div>

        <div class="controls">

          <button onClick="startAudio()" class="primary" id="startAudio">Start Audio</button>
          <button onClick="muteAudio()" class="primary" id="muteAudio">Mute</button>
          <button onClick="unmuteAudio()" class="primary" id="unmuteAudio">Unmute</button>

          <button onClick="startVideo()" class="primary" id="startVideo">Start Video</button>
          <button onClick="stopVideo()" class="primary" id="stopVideo">Stop Video</button>

          <button onClick="leaveSession()" class="leave" id="leaveSession">Leave Session</button>
        </div>
      </div>
    </main>

    <script src="https://source.zoom.us/videosdk/zoom-video-2.5.0.min.js"></script>
    <script type="text/javascript" src="scripts.js"></script>
  </body>
</html>
